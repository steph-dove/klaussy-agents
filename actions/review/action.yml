name: klaussy review
description: Multi-agent code review on every pull request, on your repo's own conventions, with no AI slop.
author: Dovatech LLC
branding:
  icon: check-circle
  color: purple

inputs:
  agent:
    description: Coding agent that runs the review, claude, copilot or codex.
    required: false
    default: claude
  anthropic-api-key:
    description: Anthropic API key, for agent claude. Provide this or claude-code-oauth-token.
    required: false
  claude-code-oauth-token:
    description: Claude Code OAuth token from `claude setup-token`, instead of an API key.
    required: false
  copilot-github-token:
    description: Fine-grained GitHub token with the Copilot Requests permission, for agent copilot.
    required: false
  openai-api-key:
    description: OpenAI API key, for agent codex.
    required: false
  model:
    description: Model the review runs on. Defaults to claude-opus-5-5 for claude, and to the CLI's own default for copilot and codex.
    required: false
    default: ""
  include-nits:
    description: Also report Warn and Nit findings.
    required: false
    default: "false"
  event:
    description: Review event to post, COMMENT, REQUEST_CHANGES or APPROVE.
    required: false
    default: COMMENT
  enrich:
    description: When the base branch has no CLAUDE.md, let `klaussy init` enrich the generated one with Claude (agent claude only). This runs Claude over the pull request's code a second time, outside the review's restrictions.
    required: false
    default: "false"
  max-budget-usd:
    description: Spending cap for one review, for agent claude.
    required: false
    default: "20"
  max-ai-credits:
    description: AI credit cap for one review, for agent copilot. Empty means no cap.
    required: false
    default: ""
  github-token:
    description: Token used to post the review.
    required: false
    default: ${{ github.token }}
  claude-code-version:
    description: Claude Code CLI version to install.
    required: false
    default: 2.1.296
  copilot-version:
    description: GitHub Copilot CLI version to install.
    required: false
    default: 1.0.95
  codex-version:
    description: Codex CLI version to install.
    required: false
    default: 0.147.0

runs:
  using: composite
  steps:
    - name: Check the event and credentials
      id: gate
      shell: bash
      env:
        AGENT: ${{ inputs.agent }}
        EVENT: ${{ inputs.event }}
        HAS_CLAUDE_KEY: ${{ inputs.anthropic-api-key != '' || inputs.claude-code-oauth-token != '' }}
        HAS_COPILOT_KEY: ${{ inputs.copilot-github-token != '' }}
        HAS_CODEX_KEY: ${{ inputs.openai-api-key != '' }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        BASE_REPO: ${{ github.repository }}
        ACTOR: ${{ github.actor }}
      run: |
        if [ -z "$PR" ]; then
          echo "::error::klaussy review runs on pull_request events."
          exit 1
        fi
        case "$EVENT" in
          COMMENT|REQUEST_CHANGES|APPROVE) ;;
          *) echo "::error::event must be COMMENT, REQUEST_CHANGES or APPROVE, not '$EVENT'."; exit 1 ;;
        esac
        case "$AGENT" in
          claude) has_key="$HAS_CLAUDE_KEY"; needed="anthropic-api-key or claude-code-oauth-token" ;;
          copilot) has_key="$HAS_COPILOT_KEY"; needed="copilot-github-token" ;;
          codex) has_key="$HAS_CODEX_KEY"; needed="openai-api-key" ;;
          *) echo "::error::agent must be claude, copilot or codex, not '$AGENT'."; exit 1 ;;
        esac
        if [ "$has_key" != "true" ]; then
          if [ "$HEAD_REPO" != "$BASE_REPO" ] || [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "::notice::Fork and Dependabot pull requests get no Actions secrets, so the review is skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::No credential for agent $AGENT. Set $needed."
          exit 1
        fi
        echo "run=true" >> "$GITHUB_OUTPUT"

    - name: Check out the pull request head
      if: steps.gate.outputs.run == 'true'
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      if: steps.gate.outputs.run == 'true'
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install klaussy and the agent
      if: steps.gate.outputs.run == 'true'
      shell: bash
      env:
        AGENT: ${{ inputs.agent }}
        ACTION_PATH: ${{ github.action_path }}
        CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
        COPILOT_VERSION: ${{ inputs.copilot-version }}
        CODEX_VERSION: ${{ inputs.codex-version }}
        PYTHONSAFEPATH: "1"
      run: |
        # Run from outside the checkout: python -m and npm both read config and modules from the
        # working directory, which here is the pull request's code.
        cd "$RUNNER_TEMP"
        python3 -m pip install --quiet --upgrade pip
        if [ -f "$ACTION_PATH/../../pyproject.toml" ]; then
          python3 -m pip install --quiet "$ACTION_PATH/../.."
        else
          python3 -m pip install --quiet klaussy-agents
        fi
        if [ "$AGENT" = copilot ]; then
          npm install --global --no-audit --no-fund "@github/copilot@$COPILOT_VERSION"
        elif [ "$AGENT" = codex ]; then
          npm install --global --no-audit --no-fund "@openai/codex@$CODEX_VERSION"
        else
          npm install --global --no-audit --no-fund "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
        fi

    - name: Review
      if: steps.gate.outputs.run == 'true'
      shell: bash
      env:
        AGENT: ${{ inputs.agent }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        MODEL: ${{ inputs.model }}
        BUDGET: ${{ inputs.max-budget-usd }}
        MAX_AI_CREDITS: ${{ inputs.max-ai-credits }}
        INCLUDE_NITS: ${{ inputs.include-nits }}
        ENRICH: ${{ inputs.enrich }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        COPILOT_GITHUB_TOKEN: ${{ inputs.copilot-github-token }}
        CODEX_API_KEY: ${{ inputs.openai-api-key }}
        # The working directory is the PR checkout; keep it off sys.path.
        PYTHONSAFEPATH: "1"
      run: |
        # The reviewer never gets a token that can write to the repo. `klaussy review` scrubs the
        # checkout, guards git and klaussy, and runs the agent; see src/klaussy/review_run.py.
        unset GH_TOKEN GITHUB_TOKEN
        args=(--headless --repo . --agent "$AGENT" --base "origin/${BASE_REF}"
          --repo-name "$(basename "$GITHUB_REPOSITORY")" --budget-usd "$BUDGET"
          --out "$RUNNER_TEMP/klaussy-result.json" --diff-out "$RUNNER_TEMP/pr.diff"
          --work-dir "$RUNNER_TEMP/klaussy")
        if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
        if [ -n "$MAX_AI_CREDITS" ]; then args+=(--max-ai-credits "$MAX_AI_CREDITS"); fi
        if [ "$INCLUDE_NITS" = "true" ]; then args+=(--include-nits); fi
        if [ "$ENRICH" = "true" ]; then args+=(--enrich); fi
        status=0
        klaussy review "${args[@]}" || status=$?
        if [ -f "$RUNNER_TEMP/klaussy-result.json" ]; then cat "$RUNNER_TEMP/klaussy-result.json"; fi
        if [ "$status" != 0 ]; then
          echo "::error::The review didn't finish; the result above says why."
          exit 1
        fi

    - name: Post the review
      if: steps.gate.outputs.run == 'true'
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR: ${{ github.event.pull_request.number }}
        EVENT: ${{ inputs.event }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GH_TOKEN: ${{ inputs.github-token }}
        PYTHONSAFEPATH: "1"
        # review-post strips these values from anything it posts.
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        COPILOT_GITHUB_TOKEN: ${{ inputs.copilot-github-token }}
        CODEX_API_KEY: ${{ inputs.openai-api-key }}
      run: |
        klaussy review-post --report REVIEW_OUTPUT.md --diff "$RUNNER_TEMP/pr.diff" --event "$EVENT" --commit "$HEAD_SHA" > "$RUNNER_TEMP/review.json"
        if ! gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" --input "$RUNNER_TEMP/review.json" > /dev/null; then
          echo "::warning::Posting the review failed; retrying without inline comments."
          klaussy review-post --report REVIEW_OUTPUT.md --diff "$RUNNER_TEMP/pr.diff" --event "$EVENT" --commit "$HEAD_SHA" --no-inline > "$RUNNER_TEMP/review.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" --input "$RUNNER_TEMP/review.json" > /dev/null
        fi
        klaussy review-post --report REVIEW_OUTPUT.md --diff "$RUNNER_TEMP/pr.diff" --no-inline \
          | jq -r .body >> "$GITHUB_STEP_SUMMARY"
