name: klaussy review
description: Multi-agent code review on every pull request, on your repo's own conventions, with no AI slop.
author: Dovatech LLC
branding:
  icon: check-circle
  color: purple

inputs:
  agent:
    description: Coding agent that runs the review, claude or copilot.
    required: false
    default: claude
  anthropic-api-key:
    description: Anthropic API key, for agent claude. Provide this or claude-code-oauth-token.
    required: false
  claude-code-oauth-token:
    description: Claude Code OAuth token from `claude setup-token`, instead of an API key.
    required: false
  copilot-github-token:
    description: Fine-grained GitHub token with the Copilot Requests permission, for agent copilot.
    required: false
  model:
    description: Model the review runs on. Defaults to claude-opus-5-5 for claude and to Copilot's own default for copilot.
    required: false
    default: ""
  include-nits:
    description: Also report Warn and Nit findings.
    required: false
    default: "false"
  event:
    description: Review event to post, COMMENT or REQUEST_CHANGES.
    required: false
    default: COMMENT
  enrich:
    description: When the repo has no CLAUDE.md, let `klaussy init` enrich the generated one with Claude (agent claude only).
    required: false
    default: "true"
  max-budget-usd:
    description: Spending cap for one review, for agent claude.
    required: false
    default: "10"
  max-ai-credits:
    description: AI credit cap for one review, for agent copilot. Empty means no cap.
    required: false
    default: ""
  github-token:
    description: Token used to post the review.
    required: false
    default: ${{ github.token }}
  claude-code-version:
    description: Claude Code CLI version to install.
    required: false
    default: 2.1.296
  copilot-version:
    description: GitHub Copilot CLI version to install.
    required: false
    default: 1.0.95

runs:
  using: composite
  steps:
    - name: Check the event and credentials
      id: gate
      shell: bash
      env:
        AGENT: ${{ inputs.agent }}
        HAS_CLAUDE_KEY: ${{ inputs.anthropic-api-key != '' || inputs.claude-code-oauth-token != '' }}
        HAS_COPILOT_KEY: ${{ inputs.copilot-github-token != '' }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        BASE_REPO: ${{ github.repository }}
      run: |
        if [ -z "$PR" ]; then
          echo "::error::klaussy review runs on pull_request events."
          exit 1
        fi
        case "$AGENT" in
          claude) has_key="$HAS_CLAUDE_KEY"; needed="anthropic-api-key or claude-code-oauth-token" ;;
          copilot) has_key="$HAS_COPILOT_KEY"; needed="copilot-github-token" ;;
          *) echo "::error::agent must be claude or copilot, not '$AGENT'."; exit 1 ;;
        esac
        if [ "$has_key" != "true" ]; then
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::notice::Fork pull requests get no secrets, so the review is skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::No credential for agent $AGENT. Set $needed."
          exit 1
        fi
        echo "run=true" >> "$GITHUB_OUTPUT"

    - name: Check out the pull request head
      if: steps.gate.outputs.run == 'true'
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      if: steps.gate.outputs.run == 'true'
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install klaussy and the agent
      if: steps.gate.outputs.run == 'true'
      shell: bash
      env:
        AGENT: ${{ inputs.agent }}
        ACTION_PATH: ${{ github.action_path }}
        CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
        COPILOT_VERSION: ${{ inputs.copilot-version }}
      run: |
        python3 -m pip install --quiet --upgrade pip
        if [ -f "$ACTION_PATH/../../pyproject.toml" ]; then
          python3 -m pip install --quiet "$ACTION_PATH/../.."
        else
          python3 -m pip install --quiet klaussy-agents
        fi
        if [ "$AGENT" = copilot ]; then
          npm install --global --no-audit --no-fund "@github/copilot@$COPILOT_VERSION"
        else
          npm install --global --no-audit --no-fund "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
        fi

    - name: Set up the review skill
      if: steps.gate.outputs.run == 'true'
      shell: bash
      env:
        AGENT: ${{ inputs.agent }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        ENRICH: ${{ inputs.enrich }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
      run: |
        # The pull request must not configure its own review, so its agent config goes and the
        # conventions come from the base branch.
        rm -rf REVIEW_OUTPUT.md .claude/skills .claude/agents .claude/commands .claude/hooks \
          .claude/settings.json .claude/settings.local.json .mcp.json \
          .github/skills .github/agents .github/hooks .copilot
        for path in CLAUDE.md .claude/rules AGENTS.md .github/copilot-instructions.md .github/instructions; do
          rm -rf "$path"
          if git cat-file -e "origin/${BASE_REF}:${path}" 2>/dev/null; then
            git checkout -q "origin/${BASE_REF}" -- "$path"
          fi
        done
        if [ ! -f CLAUDE.md ]; then
          flags="--skip-enrich"
          [ "$AGENT" = claude ] && [ "$ENRICH" = "true" ] && flags=""
          klaussy init --repo . -b "$BASE_REF" --agents "$AGENT" --force $flags
        fi
        klaussy skills --repo . -b "$BASE_REF" --agents "$AGENT" --force
        # init writes a broad allow-list and hooks that would widen the reviewer's tools.
        rm -rf .claude/settings.json .claude/settings.local.json .claude/hooks .github/hooks

    - name: Review
      if: steps.gate.outputs.run == 'true'
      shell: bash
      env:
        AGENT: ${{ inputs.agent }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        MODEL: ${{ inputs.model }}
        BUDGET: ${{ inputs.max-budget-usd }}
        MAX_AI_CREDITS: ${{ inputs.max-ai-credits }}
        INCLUDE_NITS: ${{ inputs.include-nits }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        COPILOT_GITHUB_TOKEN: ${{ inputs.copilot-github-token }}
        CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      run: |
        # The reviewer never gets a token that can write to the repo.
        unset GH_TOKEN GITHUB_TOKEN
        repo_name="$(basename "$GITHUB_REPOSITORY")"
        nits=""
        [ "$INCLUDE_NITS" = "true" ] && nits="Include nits: report Warn and Nit findings too. "
        prompt="Use the ${repo_name}-review skill to review this branch (HEAD) against \`origin/${BASE_REF}\`. ${nits}There is no one to answer questions: make reasonable calls yourself and finish by writing REVIEW_OUTPUT.md."
        resume_prompt="REVIEW_OUTPUT.md doesn't exist yet. Finish the review and write it."
        git_commands=(diff log show status merge-base rev-parse ls-files branch symbolic-ref blame)

        if [ "$AGENT" = copilot ]; then
          unset ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN
          allowed=("write(REVIEW_OUTPUT.md)" "shell(klaussy base)" "shell(klaussy review-prep)" "shell(ls)" "shell(wc)")
          for c in "${git_commands[@]}"; do allowed+=("shell(git $c)"); done
          flags=(--deny-tool=url --disable-builtin-mcps --no-ask-user --disallow-temp-dir
            --secret-env-vars=COPILOT_GITHUB_TOKEN --add-dir "$PWD" --no-auto-update
            --output-format json --usage-output-file "$RUNNER_TEMP/klaussy-usage.json")
          for tool in "${allowed[@]}"; do flags+=("--allow-tool=$tool"); done
          [ -n "$MODEL" ] && flags+=(--model "$MODEL")
          [ -n "$MAX_AI_CREDITS" ] && flags+=(--max-ai-credits "$MAX_AI_CREDITS")
          session="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          status=0
          copilot -p "$prompt" --session-id "$session" "${flags[@]}" > "$RUNNER_TEMP/klaussy-run.json" || status=$?
          if [ ! -f REVIEW_OUTPUT.md ]; then
            status=0
            copilot -p "$resume_prompt" --resume="$session" "${flags[@]}" > "$RUNNER_TEMP/klaussy-run.json" || status=$?
          fi
          [ "$status" = 0 ] || echo "::warning::Copilot exited with status $status."
        else
          unset COPILOT_GITHUB_TOKEN
          allowed=(
            Read Grep Glob Agent Skill TodoWrite
            "Write(REVIEW_OUTPUT.md)" "Edit(REVIEW_OUTPUT.md)"
            "Bash(klaussy base:*)" "Bash(klaussy review-prep:*)"
            "Bash(python3 -m klaussy base:*)" "Bash(python3 -m klaussy review-prep:*)"
            "Bash(python -m klaussy base:*)" "Bash(python -m klaussy review-prep:*)"
            "Bash(ls:*)" "Bash(wc:*)"
          )
          for c in "${git_commands[@]}"; do allowed+=("Bash(git $c:*)"); done
          run_claude() {
            claude -p "$1" "${@:2}" \
              --model "${MODEL:-claude-opus-5-5}" \
              --max-budget-usd "$BUDGET" \
              --allowedTools "${allowed[@]}" \
              --disallowedTools WebFetch WebSearch ScheduleWakeup "Read(//proc/**)" \
              --settings '{"disableAllHooks": true}' \
              --strict-mcp-config \
              --output-format json > "$RUNNER_TEMP/klaussy-run.json"
          }
          run_claude "$prompt"
          if [ ! -f REVIEW_OUTPUT.md ]; then
            session="$(jq -r '.session_id // empty' "$RUNNER_TEMP/klaussy-run.json")"
            if [ -n "$session" ]; then
              run_claude "$resume_prompt" --resume "$session"
            fi
          fi
        fi

        if [ ! -f REVIEW_OUTPUT.md ]; then
          echo "::error::The review ended without writing REVIEW_OUTPUT.md."
          tail -c 4000 "$RUNNER_TEMP/klaussy-run.json"
          exit 1
        fi
        if [ "$AGENT" = claude ]; then
          jq -r '"Review cost: $\(.total_cost_usd // 0)"' "$RUNNER_TEMP/klaussy-run.json"
        elif [ -f "$RUNNER_TEMP/klaussy-usage.json" ]; then
          echo "Review usage:" && cat "$RUNNER_TEMP/klaussy-usage.json"
        fi

    - name: Post the review
      if: steps.gate.outputs.run == 'true'
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR: ${{ github.event.pull_request.number }}
        EVENT: ${{ inputs.event }}
        GH_TOKEN: ${{ inputs.github-token }}
        # review-post strips these values from anything it posts.
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        COPILOT_GITHUB_TOKEN: ${{ inputs.copilot-github-token }}
      run: |
        git diff "origin/${BASE_REF}...HEAD" > "$RUNNER_TEMP/pr.diff"
        klaussy review-post --report REVIEW_OUTPUT.md --diff "$RUNNER_TEMP/pr.diff" --event "$EVENT" > "$RUNNER_TEMP/review.json"
        if ! gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" --input "$RUNNER_TEMP/review.json" > /dev/null; then
          echo "::warning::Inline comments were rejected; posting the review as one comment instead."
          klaussy review-post --report REVIEW_OUTPUT.md --diff "$RUNNER_TEMP/pr.diff" --event "$EVENT" --no-inline > "$RUNNER_TEMP/review.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" --input "$RUNNER_TEMP/review.json" > /dev/null
        fi
        klaussy review-post --report REVIEW_OUTPUT.md --diff "$RUNNER_TEMP/pr.diff" --no-inline \
          | jq -r .body >> "$GITHUB_STEP_SUMMARY"
