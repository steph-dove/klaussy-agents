name: klaussy review
description: Multi-agent code review on every pull request, on your repo's own conventions, with no AI slop.
author: Dovatech LLC
branding:
  icon: check-circle
  color: purple

inputs:
  agent:
    description: Coding agent that runs the review, claude or copilot.
    required: false
    default: claude
  anthropic-api-key:
    description: Anthropic API key, for agent claude. Provide this or claude-code-oauth-token.
    required: false
  claude-code-oauth-token:
    description: Claude Code OAuth token from `claude setup-token`, instead of an API key.
    required: false
  copilot-github-token:
    description: Fine-grained GitHub token with the Copilot Requests permission, for agent copilot.
    required: false
  model:
    description: Model the review runs on. Defaults to claude-opus-5-5 for claude and to Copilot's own default for copilot.
    required: false
    default: ""
  include-nits:
    description: Also report Warn and Nit findings.
    required: false
    default: "false"
  event:
    description: Review event to post, COMMENT, REQUEST_CHANGES or APPROVE.
    required: false
    default: COMMENT
  enrich:
    description: When the base branch has no CLAUDE.md, let `klaussy init` enrich the generated one with Claude (agent claude only). This runs Claude over the pull request's code a second time, outside the review's restrictions.
    required: false
    default: "false"
  max-budget-usd:
    description: Spending cap for one review, for agent claude.
    required: false
    default: "10"
  max-ai-credits:
    description: AI credit cap for one review, for agent copilot. Empty means no cap.
    required: false
    default: ""
  github-token:
    description: Token used to post the review.
    required: false
    default: ${{ github.token }}
  claude-code-version:
    description: Claude Code CLI version to install.
    required: false
    default: 2.1.296
  copilot-version:
    description: GitHub Copilot CLI version to install.
    required: false
    default: 1.0.95

runs:
  using: composite
  steps:
    - name: Check the event and credentials
      id: gate
      shell: bash
      env:
        AGENT: ${{ inputs.agent }}
        EVENT: ${{ inputs.event }}
        HAS_CLAUDE_KEY: ${{ inputs.anthropic-api-key != '' || inputs.claude-code-oauth-token != '' }}
        HAS_COPILOT_KEY: ${{ inputs.copilot-github-token != '' }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        BASE_REPO: ${{ github.repository }}
        ACTOR: ${{ github.actor }}
      run: |
        if [ -z "$PR" ]; then
          echo "::error::klaussy review runs on pull_request events."
          exit 1
        fi
        case "$EVENT" in
          COMMENT|REQUEST_CHANGES|APPROVE) ;;
          *) echo "::error::event must be COMMENT, REQUEST_CHANGES or APPROVE, not '$EVENT'."; exit 1 ;;
        esac
        case "$AGENT" in
          claude) has_key="$HAS_CLAUDE_KEY"; needed="anthropic-api-key or claude-code-oauth-token" ;;
          copilot) has_key="$HAS_COPILOT_KEY"; needed="copilot-github-token" ;;
          *) echo "::error::agent must be claude or copilot, not '$AGENT'."; exit 1 ;;
        esac
        if [ "$has_key" != "true" ]; then
          if [ "$HEAD_REPO" != "$BASE_REPO" ] || [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "::notice::Fork and Dependabot pull requests get no Actions secrets, so the review is skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::No credential for agent $AGENT. Set $needed."
          exit 1
        fi
        echo "run=true" >> "$GITHUB_OUTPUT"

    - name: Check out the pull request head
      if: steps.gate.outputs.run == 'true'
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      if: steps.gate.outputs.run == 'true'
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install klaussy and the agent
      if: steps.gate.outputs.run == 'true'
      shell: bash
      env:
        AGENT: ${{ inputs.agent }}
        ACTION_PATH: ${{ github.action_path }}
        CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
        COPILOT_VERSION: ${{ inputs.copilot-version }}
        PYTHONSAFEPATH: "1"
      run: |
        # Run from outside the checkout: python -m and npm both read config and modules from the
        # working directory, which here is the pull request's code.
        cd "$RUNNER_TEMP"
        python3 -m pip install --quiet --upgrade pip
        if [ -f "$ACTION_PATH/../../pyproject.toml" ]; then
          python3 -m pip install --quiet "$ACTION_PATH/../.."
        else
          python3 -m pip install --quiet klaussy-agents
        fi
        if [ "$AGENT" = copilot ]; then
          npm install --global --no-audit --no-fund "@github/copilot@$COPILOT_VERSION"
        else
          npm install --global --no-audit --no-fund "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
        fi

    - name: Set up the review skill
      if: steps.gate.outputs.run == 'true'
      shell: bash
      env:
        AGENT: ${{ inputs.agent }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        ENRICH: ${{ inputs.enrich }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        # The working directory is the PR checkout; keep it off sys.path for `python -c`/`-m`.
        PYTHONSAFEPATH: "1"
      run: |
        # Taken before the reviewer runs, so posting never runs git on a checkout it could touch.
        git diff --no-ext-diff --no-textconv "origin/${BASE_REF}...HEAD" > "$RUNNER_TEMP/pr.diff"
        # The pull request must not configure its own review, so its agent config goes and the
        # conventions come from the base branch, at any depth.
        for dir in .claude .claude/rules .github .github/instructions; do
          if [ -L "$dir" ]; then rm -f "$dir"; fi
        done
        find . -mindepth 2 -name .claude -not -path './.git/*' -prune -exec rm -rf {} +
        rm -rf REVIEW_OUTPUT.md .claude/skills .claude/agents .claude/commands .claude/hooks \
          .claude/settings.json .claude/settings.local.json .mcp.json \
          .github/skills .github/agents .github/hooks .copilot
        conventions='(^|/)(CLAUDE\.md|CLAUDE\.local\.md|AGENTS\.md|GEMINI\.md)$|^\.claude/rules(/|$)|^\.github/copilot-instructions\.md$|^\.github/instructions(/|$)'
        { git ls-files -z; git ls-tree -r -z --name-only "origin/${BASE_REF}"; } |
          { grep -zE "$conventions" || true; } | sort -zu |
          while IFS= read -r -d '' path; do
            rm -f "$path"
            if git cat-file -e "origin/${BASE_REF}:${path}" 2>/dev/null; then
              git checkout -q "origin/${BASE_REF}" -- "$path"
            fi
          done
        if [ ! -f CLAUDE.md ]; then
          flags="--skip-enrich"
          [ "$AGENT" = claude ] && [ "$ENRICH" = "true" ] && flags=""
          klaussy init --repo . -b "$BASE_REF" --agents "$AGENT" --force $flags
        fi
        # init can regenerate conventions the base branch already has; the base's win, and the
        # review skill is built from them afterwards.
        git ls-tree -r -z --name-only "origin/${BASE_REF}" | { grep -zE "$conventions" || true; } |
          while IFS= read -r -d '' path; do git checkout -q "origin/${BASE_REF}" -- "$path"; done
        klaussy skills --repo . -b "$BASE_REF" --agents "$AGENT" --force
        # init writes a broad allow-list and hooks that would widen the reviewer's tools.
        rm -rf .claude/settings.json .claude/settings.local.json .claude/hooks .github/hooks

    - name: Review
      if: steps.gate.outputs.run == 'true'
      shell: bash
      env:
        AGENT: ${{ inputs.agent }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        MODEL: ${{ inputs.model }}
        BUDGET: ${{ inputs.max-budget-usd }}
        MAX_AI_CREDITS: ${{ inputs.max-ai-credits }}
        INCLUDE_NITS: ${{ inputs.include-nits }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        COPILOT_GITHUB_TOKEN: ${{ inputs.copilot-github-token }}
        CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        PYTHONSAFEPATH: "1"
      run: |
        # The reviewer never gets a token that can write to the repo.
        unset GH_TOKEN GITHUB_TOKEN
        # git options that write files, run commands or read outside the repo are refused, so an
        # allowed `git log` can't plant a diff driver; global and system config are ignored.
        guard="$RUNNER_TEMP/klaussy-git-guard"
        mkdir -p "$guard"
        cat > "$guard/git" <<'GUARD'
        #!/usr/bin/env bash
        # git takes any unambiguous prefix of a long option, so a prefix of a blocked one is refused too.
        blocked="output contents config-env exec-path git-dir work-tree ext-diff textconv no-index ignore-revs-file"
        branch_blocked="delete move copy force set-upstream-to unset-upstream edit-description"
        refuse() { echo "git $1 is not allowed during a klaussy review" >&2; exit 1; }
        sub=""
        for arg in "$@"; do
          [ "$arg" = "--" ] && break
          name="${arg%%=*}"
          case "$name" in
            --?*)
              list="$blocked"
              [ "$sub" = branch ] && list="$list $branch_blocked"
              for b in $list; do
                case "$b" in "${name#--}"*) refuse "$arg" ;; esac
              done ;;
            -c*|-C*) refuse "$arg" ;;
            -*S*) [ "$sub" = blame ] && refuse "$arg" ;;
            -*[dDmMfu]*) [ "$sub" = branch ] && refuse "$arg" ;;
          esac
          [ -z "$sub" ] && [ "${arg#-}" = "$arg" ] && sub="$arg"
        done
        exec REAL_GIT --no-replace-objects "$@"
        GUARD
        # Copilot can only allow `klaussy` as a whole, so the subcommands are limited here.
        cat > "$guard/klaussy" <<'GUARD'
        #!/usr/bin/env bash
        case "${1:-}" in
          base|review-prep) exec REAL_KLAUSSY "$@" ;;
        esac
        echo "klaussy ${1:-} is not allowed during a klaussy review" >&2
        exit 1
        GUARD
        sed -i.bak -e "s|REAL_GIT|$(command -v git)|" -e "s|REAL_KLAUSSY|$(command -v klaussy)|" "$guard/git" "$guard/klaussy"
        rm -f "$guard"/*.bak
        chmod +x "$guard/git" "$guard/klaussy"
        export PATH="$guard:$PATH" GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
        skill="$(python3 -c 'import sys; from klaussy.skills import sanitize_skill_namespace as s; print(s(sys.argv[1]))' "$(basename "$GITHUB_REPOSITORY")")-review"
        nits=""
        [ "$INCLUDE_NITS" = "true" ] && nits="Include nits: report Warn and Nit findings too. "
        prompt="Use the ${skill} skill to review this branch (HEAD) against \`origin/${BASE_REF}\`. ${nits}There is no one to answer questions: make reasonable calls yourself and finish by writing REVIEW_OUTPUT.md."
        resume_prompt="REVIEW_OUTPUT.md doesn't exist yet. Finish the review and write it."
        git_commands=(diff log show status merge-base rev-parse ls-files branch blame)

        if [ "$AGENT" = copilot ]; then
          unset ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN
          allowed=("write(REVIEW_OUTPUT.md)" "shell(klaussy)" "shell(ls)")
          for c in "${git_commands[@]}"; do allowed+=("shell(git $c)"); done
          flags=(--deny-tool=url --disable-builtin-mcps --no-ask-user --disallow-temp-dir
            --secret-env-vars=COPILOT_GITHUB_TOKEN --add-dir "$PWD" --no-auto-update
            --output-format json --usage-output-file "$RUNNER_TEMP/klaussy-usage.json")
          for tool in "${allowed[@]}"; do flags+=("--allow-tool=$tool"); done
          [ -n "$MODEL" ] && flags+=(--model "$MODEL")
          [ -n "$MAX_AI_CREDITS" ] && flags+=(--max-ai-credits "$MAX_AI_CREDITS")
          session="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          status=0
          copilot -p "$prompt" --session-id "$session" "${flags[@]}" > "$RUNNER_TEMP/klaussy-run.json" || status=$?
          if [ ! -f REVIEW_OUTPUT.md ] && [ "$status" = 0 ]; then
            if [ -n "$MAX_AI_CREDITS" ]; then
              echo "::error::max-ai-credits is set and Copilot can't report what's left of it, so the review isn't resumed."
            else
              flags=("${flags[@]/klaussy-usage.json/klaussy-usage-resume.json}")
              copilot -p "$resume_prompt" --resume="$session" "${flags[@]}" > "$RUNNER_TEMP/klaussy-run.json" || status=$?
            fi
          fi
        else
          unset COPILOT_GITHUB_TOKEN
          allowed=(
            Read Grep Glob Agent Skill TodoWrite
            "Write(REVIEW_OUTPUT.md)" "Edit(REVIEW_OUTPUT.md)"
            "Bash(klaussy base:*)" "Bash(klaussy review-prep:*)"
            "Bash(python3 -m klaussy base:*)" "Bash(python3 -m klaussy review-prep:*)"
            "Bash(python -m klaussy base:*)" "Bash(python -m klaussy review-prep:*)"
            "Bash(ls:*)"
          )
          for c in "${git_commands[@]}"; do allowed+=("Bash(git $c:*)"); done
          run_claude() {
            claude -p "$2" "${@:3}" \
              --model "${MODEL:-claude-opus-5-5}" \
              --max-budget-usd "$1" \
              --allowedTools "${allowed[@]}" \
              --disallowedTools WebFetch WebSearch ScheduleWakeup "Read(//proc/**)" \
              --settings '{"disableAllHooks": true}' \
              --strict-mcp-config \
              --output-format json > "$RUNNER_TEMP/klaussy-run.json"
          }
          status=0
          run_claude "$BUDGET" "$prompt" || status=$?
          spent="$(jq -er '.total_cost_usd' "$RUNNER_TEMP/klaussy-run.json" 2>/dev/null || echo unknown)"
          if [ ! -f REVIEW_OUTPUT.md ] && [ "$status" = 0 ]; then
            session="$(jq -r '.session_id // empty' "$RUNNER_TEMP/klaussy-run.json" 2>/dev/null || true)"
            if [ "$spent" = unknown ]; then
              echo "::error::The first run's cost couldn't be read, so it isn't resumed past an unknown spend."
            else
              left="$(python3 -c 'import sys; print(round(float(sys.argv[1]) - float(sys.argv[2]), 2))' "$BUDGET" "$spent")"
              if [ -z "$session" ]; then
                echo "::error::The first run left no session to resume."
              elif python3 -c 'import sys; sys.exit(float(sys.argv[1]) < 0.5)' "$left"; then
                run_claude "$left" "$resume_prompt" --resume "$session" || status=$?
                more="$(jq -er '.total_cost_usd' "$RUNNER_TEMP/klaussy-run.json" 2>/dev/null || echo unknown)"
                if [ "$more" = unknown ]; then
                  spent="$spent + unknown"
                else
                  spent="$(python3 -c 'import sys; print(float(sys.argv[1]) + float(sys.argv[2]))' "$spent" "$more")"
                fi
              else
                echo "::error::Budget used up (\$$spent of \$$BUDGET spent), so the review isn't resumed."
              fi
            fi
          fi
        fi

        if [ "$status" != 0 ]; then
          echo "::error::$AGENT exited with status $status, so the review may be incomplete."
          tail -c 4000 "$RUNNER_TEMP/klaussy-run.json"
          exit 1
        fi

        if [ ! -f REVIEW_OUTPUT.md ]; then
          echo "::error::The review ended without writing REVIEW_OUTPUT.md."
          tail -c 4000 "$RUNNER_TEMP/klaussy-run.json"
          exit 1
        fi
        if [ "$AGENT" = claude ]; then
          echo "Review cost: \$$spent"
        else
          for usage in "$RUNNER_TEMP"/klaussy-usage*.json; do
            if [ -f "$usage" ]; then echo "Review usage ($(basename "$usage")):"; cat "$usage"; fi
          done
        fi

    - name: Post the review
      if: steps.gate.outputs.run == 'true'
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR: ${{ github.event.pull_request.number }}
        EVENT: ${{ inputs.event }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GH_TOKEN: ${{ inputs.github-token }}
        PYTHONSAFEPATH: "1"
        # review-post strips these values from anything it posts.
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        COPILOT_GITHUB_TOKEN: ${{ inputs.copilot-github-token }}
      run: |
        klaussy review-post --report REVIEW_OUTPUT.md --diff "$RUNNER_TEMP/pr.diff" --event "$EVENT" --commit "$HEAD_SHA" > "$RUNNER_TEMP/review.json"
        if ! gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" --input "$RUNNER_TEMP/review.json" > /dev/null; then
          echo "::warning::Posting the review failed; retrying without inline comments."
          klaussy review-post --report REVIEW_OUTPUT.md --diff "$RUNNER_TEMP/pr.diff" --event "$EVENT" --commit "$HEAD_SHA" --no-inline > "$RUNNER_TEMP/review.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" --input "$RUNNER_TEMP/review.json" > /dev/null
        fi
        klaussy review-post --report REVIEW_OUTPUT.md --diff "$RUNNER_TEMP/pr.diff" --no-inline \
          | jq -r .body >> "$GITHUB_STEP_SUMMARY"
