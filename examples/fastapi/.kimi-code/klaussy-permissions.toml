# Generated by klaussy. Kimi Code CLI permission rules.
#
# PASTE THESE INTO ~/.kimi-code/config.toml. Kimi reads permission rules
# only from the user config; the project-local .kimi-code/local.toml
# accepts a [workspace] table only, and an unknown key makes the whole
# config fail to load — so klaussy can't commit these as live settings.
#
# The allow and deny patterns below target different tools, so they
# can't override each other whichever way Kimi resolves rule order.
# Denying Read() is not airtight: Bash/Grep/Glob can still reach a
# secret file. Keep credentials out of the workspace.

[[permission.rules]]
decision = "deny"
pattern = "Read(.env)"

[[permission.rules]]
decision = "deny"
pattern = "Read(.env.*)"

[[permission.rules]]
decision = "deny"
pattern = "Read(credentials*)"

[[permission.rules]]
decision = "deny"
pattern = "Read(secrets*)"

[[permission.rules]]
decision = "deny"
pattern = "Read(*.pem)"

[[permission.rules]]
decision = "deny"
pattern = "Read(*.key)"

[[permission.rules]]
decision = "deny"
pattern = "Read(**/service-account*.json)"

[[permission.rules]]
decision = "allow"
pattern = "Bash(git *)"

[[permission.rules]]
decision = "allow"
pattern = "Bash(gh *)"

[[permission.rules]]
decision = "allow"
pattern = "Bash(python *)"

[[permission.rules]]
decision = "allow"
pattern = "Bash(pytest *)"

[[permission.rules]]
decision = "allow"
pattern = "Bash(ruff *)"

[[permission.rules]]
decision = "allow"
pattern = "Bash(mypy *)"

[[permission.rules]]
decision = "allow"
pattern = "Bash(pip *)"

[[permission.rules]]
decision = "allow"
pattern = "Bash(uv *)"
