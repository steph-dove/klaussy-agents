# Generated by klaussy. Kimi Code CLI hook wiring.
#
# PASTE THESE INTO ~/.kimi-code/config.toml. Kimi reads [[hooks]] only from
# the user config; the project-local .kimi-code/local.toml accepts a
# [workspace] table only, and an unknown key makes the whole config fail to
# load — so klaussy can't commit these as live settings.
#
# Each command finds the repo root itself and no-ops where the guard isn't
# installed, so leaving them enabled globally is safe. The guards themselves
# live in .kimi-code/hooks/ and are refreshed by re-running klaussy.
#
# `klaussy-hook` is the launcher pip puts on PATH when klaussy is installed
# (klaussy-hook.exe on Windows) — it names no interpreter and no shell
# syntax, so these entries work as-is on macOS, Linux, and Windows.

[[hooks]]
event = "PreToolUse"
matcher = "^Bash$"
command = 'klaussy-hook --repo-relative .kimi-code/hooks/klaussy_commit_guard.py'
timeout = 60

[[hooks]]
event = "PreToolUse"
matcher = "^Bash$"
command = 'klaussy-hook --repo-relative .kimi-code/hooks/klaussy_comment_guard.py'
timeout = 60

[[hooks]]
event = "PreToolUse"
matcher = "^Bash$"
command = 'klaussy-hook --repo-relative .kimi-code/hooks/klaussy_dependency_guard.py'
timeout = 60

[[hooks]]
event = "PreToolUse"
matcher = "^Read$"
command = 'klaussy-hook --repo-relative .kimi-code/hooks/klaussy_read_guard.py'
timeout = 60

[[hooks]]
event = "Stop"
command = 'klaussy-hook --repo-relative .kimi-code/hooks/klaussy_self_review_guard.py'
timeout = 60
